services:
  - type: web
    name: zenith-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    preDeployCommand: npx prisma db push --skip-generate && npm run prisma:seed
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: zenith-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://zenith-git-fix-zenith-room-re-944e0c-mikey-sketch-hubs-projects.vercel.app
      - key: GOOGLE_ONLY_AUTH
        value: "false"

databases:
  - name: zenith-db
    plan: free
    databaseName: zenith
    user: zenith_user

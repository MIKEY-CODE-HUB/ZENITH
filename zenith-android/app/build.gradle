plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'app.zenith.shield'
    compileSdk 35

    defaultConfig {
        applicationId 'app.zenith.shield'
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
